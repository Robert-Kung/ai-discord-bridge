# Egress-containment proxy (phase 1) — default-deny hostname allow-list.
#
# The bridge container sits on a routeless `internal: true` network; this proxy is the
# ONLY path out. It is a forward CONNECT proxy: it terminates nothing (no TLS bump), it
# resolves DNS itself, and it permits a CONNECT tunnel ONLY to a host matching the
# Filter allow-list below. Everything else -> 403. It runs no agent code and mounts
# nothing, so compromising it yields only the allow-listed hosts.
#
# Verified in the step-0 spike: discord.py 2.4 gateway websocket + REST both traverse
# this via the single proxy= kwarg; `claude` honours HTTPS_PROXY.
#
# NOTE: tinyproxy does not accept trailing inline comments on directive lines.

User nobody
Group nogroup
Port 8888
Timeout 600

# Connect log level produces the grep-able CONNECT / deny lines (deny-logging).
LogLevel Connect

# Only allow CONNECT to 443 (HTTPS). No plaintext relaying.
ConnectPort 443

# Reachable from the internal docker networks only (RFC1918) + loopback. Port 8888 is
# never published, but scoping the client ACL to private ranges means the proxy can never
# become a public open-relay-to-allowlisted-hosts if 8888 is ever mapped by mistake.
# The bridge connects from its docker-network IP (RFC1918); loopback covers in-container
# self-tests. Note a client-ACL reject is "403 Access denied" (distinct from the filter's
# "403 Filtered") — both are 403, which the canary reads as PROXY_DENIED.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Hostname allow-list. Default-deny: anything not matching a line in the filter file
# is refused. BRE matched against the CONNECT target host, case-insensitive.
Filter "/etc/tinyproxy/filter"
FilterType bre
FilterDefaultDeny Yes
FilterExtended Off
FilterCaseSensitive Off
