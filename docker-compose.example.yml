# Copy this file to docker-compose.yml and fill in YOUR project paths.
#   cp docker-compose.example.yml docker-compose.yml
# The real docker-compose.yml is gitignored so your private project list and
# absolute paths never get committed.
#
# Before first run, create the dedicated minimal bot config dirs on the host
# (see SECURITY.md "Bot config dir setup"): ~/.claude-bot-a and ~/.claude-bot-b,
# each holding ONLY a minimal CLAUDE.md (no personal data, no @import of any
# shared CLAUDE.md). The bots authenticate via the single credential file
# bind-mounted below — no re-login, same subscription billing.
#
# EGRESS CONTAINMENT (phase 2, egress-exec-isolation 5.x): TWO app containers,
# each on its own routeless `internal: true` network behind its own default-deny
# CONNECT proxy:
#
#   discord-frontend — discord.py + all bridge logic EXCEPT spawning claude.
#     Holds the Discord bot tokens. Egress: Discord hosts only. Has NO Claude
#     credentials, no bot config dirs, no settings.json.
#   executor — the only place `claude -p` runs. Holds the Claude credentials.
#     Egress: api.anthropic.com only (the empirically pinned refresh+API host).
#     Has NO Discord tokens, no channel id, no user whitelist.
#
# Each secret now lives in a container whose egress cannot reach the place the
# OTHER secret is useful. IPC: a unix socket on the shared discord-state volume;
# the frontend sends semantic run-requests (never argv/env — the executor
# validates every parameter). Each container proves ITS OWN deny direction at
# startup with a fail-closed canary (frontend: Anthropic unreachable; executor:
# Discord unreachable) — see SECURITY.md §6.
services:
  proxy-discord:
    build:
      context: ./egress-proxy
      args: { FILTER: filter.discord }
    container_name: ai-discord-bridge-proxy-discord
    restart: unless-stopped
    networks: [frontend_internal, egress_outbound]
    healthcheck: &proxy_health
      test: ["CMD-SHELL", "netstat -tln 2>/dev/null | grep -q ':8888 ' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  proxy-anthropic:
    build:
      context: ./egress-proxy
      args: { FILTER: filter.anthropic }
    container_name: ai-discord-bridge-proxy-anthropic
    restart: unless-stopped
    networks: [executor_internal, egress_outbound]
    healthcheck: *proxy_health

  executor:
    build: .
    command: ["python3", "/app/executor.py"]
    container_name: ai-discord-bridge-executor
    restart: unless-stopped
    user: "1000:1000"
    networks: [executor_internal]
    depends_on:
      proxy-anthropic:
        condition: service_healthy
    # Explicit environment — NEVER env_file here: .env also carries the Discord
    # tokens, which must not exist in this container.
    #
    # ⚠️ Two tunables are CROSS-PROCESS COUPLED and must be set IDENTICALLY here and
    # on discord-frontend, or exec jobs get rejected: EXEC_TIMEOUT and CLAUDE_TIMEOUT
    # (the frontend sends a per-call timeout; the executor's _validate_exec_request
    # bounds it by its OWN copy of these). The `${VAR:-default}` interpolation below
    # reads them from the compose-dir .env so both services stay in lockstep — keep
    # the defaults matching bridge/config.py. Other non-secret tunables (flush
    # thresholds, MAX_BOT_TURNS) only matter to the frontend; set them there.
    environment:
      HOME: /home/user
      EGRESS_PROXY_URL: http://proxy-anthropic:8888
      EXECUTOR_SOCKET: /home/user/.claude-shared/discord-state/executor.sock
      EXEC_TIMEOUT: ${EXEC_TIMEOUT:-1800}
      CLAUDE_TIMEOUT: ${CLAUDE_TIMEOUT:-300}
      # M4 approver tier: the frontend serves the socket + writes the mcp-config on the
      # shared volume; the executor spawns claude and must point at the SAME paths.
      APPROVER_SOCKET_PATH: /home/user/.claude-shared/discord-state/approver.sock
      APPROVER_MCP_CONFIG_PATH: /home/user/.claude-shared/discord-state/approver-mcp.json
      # cwd whitelist for validating requested run dirs — MUST match the project
      # bind mounts below (and the frontend's PROJECT_DIRS).
      PROJECT_DIRS: >-
        /home/user/your-project-a,/home/user/your-project-b
      # API-key mode only (interpolated from .env; empty in subscription mode)
      USE_API_KEY: ${USE_API_KEY:-}
      ANTHROPIC_API_KEY_A: ${ANTHROPIC_API_KEY_A:-}
      ANTHROPIC_API_KEY_B: ${ANTHROPIC_API_KEY_B:-}
    volumes:
      # Bot identity + LIVE OAUTH CREDENTIALS — the executor is the only app
      # container that mounts these (see SECURITY.md §1/§6 for the trade-offs).
      - /home/user/.claude-bot-a:/home/user/.claude-bot-a
      - /home/user/.claude-bot-b:/home/user/.claude-bot-b
      - /home/user/.claude/.credentials.json:/home/user/.claude-bot-a/.credentials.json:ro
      - /home/user/.claude-b/.credentials.json:/home/user/.claude-bot-b/.credentials.json:ro
      # Server-side security settings (deny family), passed via --settings.
      - ./settings.json:/home/user/.claude-bridge-settings.json:ro
      # Shared bridge state: the IPC socket, sessions, jobs, worktrees, and the
      # combined system-prompt files the frontend writes for each call.
      - /home/user/.claude-shared/discord-state:/home/user/.claude-shared/discord-state
      # The conversation-layer agent itself reads these (plan-mode Grep/Read):
      # summaries (cross-session recall), plans landing zone, the thin index file.
      - /home/user/.claude-shared/discord-summaries:/home/user/.claude-shared/discord-summaries
      - /home/user/.claude-shared/discord-project-notes:/home/user/.claude-shared/discord-project-notes
      - /home/user/.claude-shared/plans:/home/user/.claude-shared/plans
      - /home/user/.claude-shared/memory/project_plan.md:/home/user/.claude-shared/memory/project_plan.md:ro
      # Project dirs: claude runs here (worktrees link back to these .git dirs).
      - /home/user/your-project-a:/home/user/your-project-a
      - /home/user/your-project-b:/home/user/your-project-b

  discord-frontend:
    build: .
    container_name: ai-discord-bridge
    restart: unless-stopped
    user: "1000:1000"
    networks: [frontend_internal]
    depends_on:
      proxy-discord:
        condition: service_healthy
      executor:
        condition: service_started
    # Explicit environment — NEVER env_file here: .env may carry API keys, which
    # must not exist in the container that can reach Discord.
    environment:
      HOME: /home/user
      EGRESS_PROXY_URL: http://proxy-discord:8888
      EXECUTOR_SOCKET: /home/user/.claude-shared/discord-state/executor.sock
      # M4 approver: socket + mcp-config must live on the shared volume — the
      # frontend serves/writes them, the claude subprocess (executor side) connects.
      APPROVER_SOCKET_PATH: /home/user/.claude-shared/discord-state/approver.sock
      APPROVER_MCP_CONFIG_PATH: /home/user/.claude-shared/discord-state/approver-mcp.json
      DISCORD_BOT_A_TOKEN: ${DISCORD_BOT_A_TOKEN}
      DISCORD_BOT_B_TOKEN: ${DISCORD_BOT_B_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS}
      # Coupled with the executor (see its note) — keep these two identical there.
      EXEC_TIMEOUT: ${EXEC_TIMEOUT:-1800}
      CLAUDE_TIMEOUT: ${CLAUDE_TIMEOUT:-300}
      # Opt-in tiers default OFF unless passed here (they gate frontend routing). The
      # split dropped env_file, so a flag set only in .env would silently revert.
      ENABLE_BYPASS_TIER: ${ENABLE_BYPASS_TIER:-}
      ENABLE_APPROVER_TIER: ${ENABLE_APPROVER_TIER:-}
      ENABLE_EXEC_EVALUATOR: ${ENABLE_EXEC_EVALUATOR:-}
      # cwd whitelist: !cd only accepts these paths (each must contain .git).
      # MUST match the project bind mounts below and the executor's copy.
      PROJECT_DIRS: >-
        /home/user/your-project-a,/home/user/your-project-b
    volumes:
      # NO bot config dirs, NO credentials, NO settings.json — this container
      # never spawns claude. Shared bridge state + memory layers only.
      - /home/user/.claude-shared/discord-state:/home/user/.claude-shared/discord-state
      - /home/user/.claude-shared/discord-summaries:/home/user/.claude-shared/discord-summaries
      - /home/user/.claude-shared/discord-project-notes:/home/user/.claude-shared/discord-project-notes
      - /home/user/.claude-shared/plans:/home/user/.claude-shared/plans
      - /home/user/.claude-shared/memory/project_plan.md:/home/user/.claude-shared/memory/project_plan.md:ro
      # Project dirs: the frontend runs the git side (worktree add/commit/diff/merge).
      - /home/user/your-project-a:/home/user/your-project-a
      - /home/user/your-project-b:/home/user/your-project-b

networks:
  # Routeless internal networks: one per app container — neither has any direct
  # path out, and neither can see the other's proxy.
  frontend_internal:
    internal: true
  executor_internal:
    internal: true
  # Only the two proxies join this one — their single route out.
  egress_outbound:
    driver: bridge
